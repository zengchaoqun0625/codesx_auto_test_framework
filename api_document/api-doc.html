<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进钱吧 接口文档</title>
<style>
/* ===================== 设计令牌 ===================== */
:root {
  --accent: #5E6AD2;
  --accent-hover: #6E78E8;
  --accent-soft: rgba(94, 106, 210, .12);
  --accent-ring: rgba(94, 106, 210, .28);
  --success: #4CB782;
  --warning: #F2C94C;
  --danger: #EB5757;
  --radius-card: 14px;
  --radius-ctl: 8px;
  --font-ui: "Inter", -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  /* 请求方法配色（贴合新色板） */
  --m-get: #4CB782; --m-post: #5E6AD2; --m-put: #F2C94C;
  --m-delete: #EB5757; --m-patch: #A78BFA; --m-other: #64748b;
}
[data-theme="dark"] {
  --bg: #08090A;
  --card: rgba(255, 255, 255, .025);
  --card-solid: #101214;
  --border: rgba(255, 255, 255, .07);
  --border-strong: rgba(255, 255, 255, .14);
  --text: #F2F3F5;
  --text-2: #9BA1A9;
  --text-3: #646A72;
  --code-bg: #0C0E12;
  --code-text: #C9D1D9;
  --input-bg: rgba(255, 255, 255, .03);
  --nav-bg: rgba(8, 9, 10, .72);
  --hover-bg: rgba(255, 255, 255, .05);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .5), 0 16px 40px -16px rgba(0, 0, 0, .65);
  --glow-a: rgba(94, 106, 210, .50);
  --glow-b: rgba(138, 99, 210, .40);
  --glow-c: rgba(45, 75, 255, .34);
  --grid-line: rgba(255, 255, 255, .035);
  --hl: rgba(242, 201, 76, .30);
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #F7F8FA;
  --card: #FFFFFF;
  --card-solid: #FFFFFF;
  --border: rgba(16, 24, 40, .08);
  --border-strong: rgba(16, 24, 40, .16);
  --text: #1B1E24;
  --text-2: #5C6470;
  --text-3: #8A919C;
  --code-bg: #F4F6F9;
  --code-text: #333A45;
  --input-bg: #FFFFFF;
  --nav-bg: rgba(255, 255, 255, .75);
  --hover-bg: rgba(16, 24, 40, .05);
  --shadow-card: 0 1px 2px rgba(16, 24, 40, .05), 0 16px 40px -20px rgba(16, 24, 40, .14);
  --glow-a: rgba(94, 106, 210, .30);
  --glow-b: rgba(138, 99, 210, .24);
  --glow-c: rgba(96, 165, 250, .26);
  --grid-line: rgba(16, 24, 40, .05);
  --hl: rgba(242, 201, 76, .45);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background .3s ease, color .3s ease;
}
::selection { background: rgba(94, 106, 210, .32); }
code, pre, .mono { font-family: var(--font-mono); }

/* ===================== 3D 动态背景 ===================== */
.bg-stage {
  position: fixed; inset: 0; z-index: -1; overflow: hidden;
  background: var(--bg); transition: background .3s ease;
}
.bg-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 52px 52px;
  -webkit-mask-image: radial-gradient(ellipse 90% 62% at 50% 0%, #000 25%, transparent 78%);
  mask-image: radial-gradient(ellipse 90% 62% at 50% 0%, #000 25%, transparent 78%);
}
.orb { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
.orb-a { width: 580px; height: 580px; top: -190px; left: 6%;
  background: radial-gradient(circle, var(--glow-a), transparent 65%);
  animation: drift-a 26s ease-in-out infinite alternate; }
.orb-b { width: 500px; height: 500px; top: 8%; right: -130px;
  background: radial-gradient(circle, var(--glow-b), transparent 65%);
  animation: drift-b 32s ease-in-out infinite alternate; }
.orb-c { width: 440px; height: 440px; bottom: -170px; left: 30%;
  background: radial-gradient(circle, var(--glow-c), transparent 65%);
  animation: drift-c 24s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(90px, 60px) scale(1.12); } }
@keyframes drift-b { to { transform: translate(-70px, 90px) scale(.92); } }
@keyframes drift-c { to { transform: translate(60px, -70px) scale(1.08); } }
.sphere {
  position: absolute; border-radius: 50%; will-change: transform;
  background:
    radial-gradient(circle at 30% 26%, rgba(255,255,255,.85), rgba(255,255,255,0) 38%),
    radial-gradient(circle at 72% 82%, rgba(0,0,0,.42), transparent 55%),
    linear-gradient(135deg, #8A90FF, #5E6AD2 55%, #3D44A8);
  box-shadow: inset -12px -18px 40px rgba(0,0,0,.35), inset 8px 10px 24px rgba(255,255,255,.25), 0 30px 60px -18px rgba(94,106,210,.55);
  animation: float-y 9s ease-in-out infinite;
}
.sphere-a { width: 150px; height: 150px; top: 130px; right: 10%; }
.sphere-b { width: 84px; height: 84px; top: 360px; left: 5%; opacity: .92; animation-delay: -4s; }
@keyframes float-y {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-22px) rotate(4deg); }
}
@media (prefers-reduced-motion: reduce) { .orb, .sphere { animation: none; } }

/* ===================== 顶部导航（毛玻璃） ===================== */
#topbar {
  height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 20px;
  position: relative; z-index: 10;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background: var(--nav-bg); border-bottom: 1px solid var(--border);
}
#topbar .logo { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand-logo {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  color: #fff; flex: none;
  background: linear-gradient(135deg, #7C87E8, #5E6AD2 60%, #4A3FA0);
  box-shadow: 0 4px 14px -4px rgba(94,106,210,.6), inset 0 1px 0 rgba(255,255,255,.25);
}
#topbar .logo .name { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
#topbar .logo .badge {
  font-size: 11px; color: var(--text-3); border: 1px solid var(--border);
  padding: 3px 9px; border-radius: 999px; font-family: var(--font-mono); letter-spacing: .5px;
}
#search-wrap { flex: 1; max-width: 520px; position: relative; }
#search {
  width: 100%; height: 38px; padding: 0 34px 0 36px; border-radius: var(--radius-ctl);
  border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
  font-size: 13px; outline: none; font-family: var(--font-ui);
  transition: border-color .15s, box-shadow .15s;
}
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
#search::placeholder { color: var(--text-3); }
#search-wrap .icon { position: absolute; left: 11px; top: 11px; color: var(--text-3); pointer-events: none; }
#search-clear {
  position: absolute; right: 8px; top: 7px; width: 24px; height: 24px; border: none;
  background: transparent; color: var(--text-3); cursor: pointer; border-radius: 6px;
  font-size: 16px; display: none; align-items: center; justify-content: center;
}
#search-clear:hover { background: var(--hover-bg); color: var(--text); }
#topbar .stats { color: var(--text-2); font-size: 12px; white-space: nowrap; font-family: var(--font-mono); }
.icon-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--text-2); display: grid; place-items: center;
  cursor: pointer; transition: .15s; font-size: 15px;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--hover-bg); }

/* ===================== 布局 ===================== */
#layout { display: flex; height: calc(100% - 60px); position: relative; z-index: 1; }
#sidebar {
  width: 320px; min-width: 320px; overflow-y: auto; padding: 14px 10px 40px;
  background: var(--nav-bg); border-right: 1px solid var(--border);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
#main { flex: 1; overflow-y: auto; padding: 28px 36px 80px; }

/* ===================== 侧边栏 ===================== */
.tag-group { margin-bottom: 6px; }
.tag-header {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer;
  border-radius: var(--radius-ctl); color: var(--text-2); font-weight: 600; font-size: 13px; user-select: none;
  transition: background .15s;
}
.tag-header:hover { background: var(--hover-bg); }
.tag-header .arrow { transition: transform .18s; font-size: 10px; width: 12px; color: var(--text-3); }
.tag-group.open .tag-header .arrow { transform: rotate(90deg); }
.tag-header .count {
  margin-left: auto; font-size: 11px; color: var(--text-3);
  border: 1px solid var(--border); padding: 1px 8px; border-radius: 999px; font-family: var(--font-mono);
}
.tag-items { display: none; padding: 2px 0 6px; }
.tag-group.open .tag-items { display: block; }
.api-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px;
  border-radius: var(--radius-ctl); cursor: pointer; border-left: 2px solid transparent;
  transition: background .15s;
}
.api-item:hover { background: var(--hover-bg); }
.api-item.active { background: var(--accent-soft); border-left-color: var(--accent); }
.api-item .names { min-width: 0; flex: 1; }
.api-item .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.api-item .path { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); }
.method-badge {
  flex-shrink: 0; min-width: 48px; text-align: center; font-size: 10px; font-weight: 700;
  padding: 3px 6px; border-radius: 6px; letter-spacing: .4px; color: #fff; font-family: var(--font-mono);
}
.m-GET { background: var(--m-get); }
.m-POST { background: var(--m-post); }
.m-PUT { background: var(--m-put); color: #1B1E24; }
.m-DELETE { background: var(--m-delete); }
.m-PATCH { background: var(--m-patch); }
.m-OTHER { background: var(--m-other); }
mark { background: var(--hl); color: inherit; border-radius: 2px; padding: 0 1px; }
#no-result { text-align: center; color: var(--text-3); padding: 40px 10px; font-size: 13px; display: none; }

/* ===================== 详情卡片（毛玻璃） ===================== */
.detail-head { margin-bottom: 22px; }
.detail-head h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 12px 0 8px; }
.detail-head .desc { color: var(--text-2); line-height: 1.7; max-width: 880px; }
.tag-chip {
  display: inline-block; font-size: 11px; padding: 3px 11px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-weight: 600;
}
.url-bar {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 12px 16px; margin-top: 16px;
}
.url-bar .method-badge { min-width: 60px; font-size: 11px; padding: 5px 8px; }
.url-bar .url { flex: 1; font-family: var(--font-mono); font-size: 13px; word-break: break-all; color: var(--text); }
.section {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  margin-bottom: 18px; overflow: hidden;
}
.section > h2 {
  font-size: 13px; font-weight: 650; padding: 13px 18px; color: var(--text);
  border-bottom: 1px solid var(--border); letter-spacing: -.01em;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.section > h2 .h2-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.section .body { padding: 14px 18px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; color: var(--text-3); font-weight: 600; font-size: 12px;
  padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.k { font-family: var(--font-mono); color: var(--accent); white-space: nowrap; font-size: 12.5px; }
td.v { font-family: var(--font-mono); word-break: break-all; font-size: 12.5px; color: var(--text-2); }
td.d { color: var(--text-2); }
.required-dot { color: var(--danger); font-weight: 700; margin-right: 3px; }
pre.code {
  background: var(--code-bg); color: var(--code-text); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; font-size: 12.5px; line-height: 1.7;
  overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 0;
}

/* ===================== 按钮 ===================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 12px; font-weight: 550; border-radius: 7px; padding: 5px 12px;
  border: 1px solid var(--border); background: transparent; color: var(--text-2);
  cursor: pointer; transition: .15s; white-space: nowrap; font-family: var(--font-ui); line-height: 1.4;
}
.btn:hover { border-color: var(--border-strong); color: var(--text); background: var(--hover-bg); }
.btn.copied { border-color: var(--success); color: var(--success); }
.btn-primary {
  background: var(--accent); border-color: var(--accent); color: #fff;
  box-shadow: 0 6px 18px -6px rgba(94,106,210,.55), inset 0 1px 0 rgba(255,255,255,.18);
}
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
.btn-primary.copied { background: var(--success); border-color: var(--success); color: #fff; box-shadow: none; }

/* ===================== 调试面板 ===================== */
.debug-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 18px; margin-top: 16px;
}
.dbg-row { display: flex; gap: 10px; margin-bottom: 12px; }
.dbg-select {
  width: 110px; flex: none; height: 36px; border-radius: var(--radius-ctl);
  border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
  font-size: 13px; font-family: var(--font-mono); padding: 0 8px; outline: none;
}
.dbg-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.dbg-input {
  flex: 1; min-width: 0; height: 36px; border-radius: var(--radius-ctl);
  border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
  font-size: 13px; font-family: var(--font-mono); padding: 0 12px; outline: none;
}
.dbg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.dbg-textarea {
  width: 100%; border-radius: var(--radius-ctl); border: 1px solid var(--border);
  background: var(--input-bg); color: var(--text); font-size: 12.5px; line-height: 1.7;
  font-family: var(--font-mono); padding: 10px 12px; outline: none; resize: vertical; min-height: 70px;
}
.dbg-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.dbg-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.dbg-hint { font-size: 11.5px; color: var(--text-3); line-height: 1.5; }
.dbg-result { margin-top: 16px; }
.dbg-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.status-chip {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 4px 12px;
  border-radius: 999px; color: #fff;
}
.status-2 { background: var(--success); }
.status-3 { background: var(--m-other); }
.status-4 { background: var(--warning); color: #1B1E24; }
.status-5 { background: var(--danger); }
.status-err { background: var(--danger); }
.dbg-meta .muted { color: var(--text-3); font-size: 12px; font-family: var(--font-mono); }
.dbg-result details { margin-bottom: 10px; }
.dbg-result summary { cursor: pointer; font-size: 12px; color: var(--text-2); padding: 4px 0; }
.dbg-result details > pre { margin-top: 8px; max-height: 220px; overflow: auto; }
#dbg-resp-body { max-height: 420px; overflow: auto; }
.dbg-spinner {
  width: 14px; height: 14px; border: 2px solid var(--border-strong); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===================== 概览 ===================== */
.stat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin: 22px 0 26px; }
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 18px;
}
.stat-card .num { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.stat-card .label { color: var(--text-3); font-size: 12px; margin-top: 4px; }
.overview-title { font-size: 26px; font-weight: 700; letter-spacing: -.03em; }
.overview-title .grad { background: linear-gradient(90deg, #7C87E8, #A78BFA); -webkit-background-clip: text; background-clip: text; color: transparent; }
.overview-sub { color: var(--text-2); margin-top: 8px; line-height: 1.8; max-width: 860px; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 860px) {
  #sidebar { width: 250px; min-width: 250px; }
  #main { padding: 18px 16px 60px; }
}
</style>
</head>

const APIS = DOC.apis || [];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const METHODS = ["GET","POST","PUT","DELETE","PATCH","HEAD","OPTIONS"];
const mClass = m => "m-" + (METHODS.includes(m) ? m : "OTHER");

function highlight(text, kw) {
  const t = esc(text);
  if (!kw) return t;
  const k = esc(kw).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp("(" + k + ")", "gi"), "<mark>$1</mark>");
}

function copyText(text, btn, okLabel) {
  const done = () => {
    if (!btn) return;
    const old = btn.textContent;
    btn.textContent = okLabel || "已复制";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1500);
  };
  if (navigator.clipboard && window.isSecureContext !== false) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta); done();
}

/* ---------- theme ---------- */
const savedTheme = DOC.theme || "dark";
document.documentElement.dataset.theme = savedTheme;
$("#theme-toggle").onclick = () => {
  const el = document.documentElement;
  el.dataset.theme = el.dataset.theme === "dark" ? "light" : "dark";
};

/* ---------- grouping ---------- */
function groupApis(list) {
  const groups = new Map();
  list.forEach(a => {
    const t = a.tag || "未分组";
    if (!groups.has(t)) groups.set(t, []);
    groups.get(t).push(a);
  });
  return groups;
}

/* ---------- sidebar ---------- */
let activeId = null;
let keyword = "";

function renderSidebar() {
  const kw = keyword.trim().toLowerCase();
  const matched = kw ? APIS.filter(a =>
    [a.name, a.path, a.url, a.description, a.method, a.tag,
     (a.headers||[]).map(h=>h.key+" "+h.value).join(" ")]
    .join(" ").toLowerCase().includes(kw)
  ) : APIS;

  const groups = groupApis(matched);
  const sb = $("#sidebar");
  let html = "";
  groups.forEach((items, tag) => {
    html += `<div class="tag-group open" data-tag="${esc(tag)}">
      <div class="tag-header"><span class="arrow">▶</span>${highlight(tag, kw)}<span class="count">${items.length}</span></div>
      <div class="tag-items">`;
    items.forEach(a => {
      html += `<div class="api-item${a.id === activeId ? " active" : ""}" data-id="${a.id}">
        <span class="method-badge ${mClass(a.method)}">${esc(a.method)}</span>
        <div class="names">
          <div class="name">${highlight(a.name || a.path, kw)}</div>
          <div class="path">${highlight(a.path || a.url, kw)}</div>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `<div id="no-result" style="display:${matched.length ? "none" : "block"}">没有匹配「${esc(keyword)}」的接口</div>`;
  sb.innerHTML = html;

  sb.querySelectorAll(".tag-header").forEach(h =>
    h.onclick = () => h.parentElement.classList.toggle("open"));
  sb.querySelectorAll(".api-item").forEach(el =>
    el.onclick = () => selectApi(+el.dataset.id, true));
  $("#stats").textContent = kw ? `匹配 ${matched.length} / ${APIS.length}` : `共 ${APIS.length} 个接口`;
  $("#search-clear").style.display = keyword ? "flex" : "none";
}

/* ---------- detail ---------- */
function tableRows(rows, cols) {
  return rows.map(r => "<tr>" + cols.map(c => `<td class="${c.cls}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join("") + "</tr>").join("");
}

function bodyText(a) {
  if (!a.body) return "";
  return typeof a.body === "string" ? a.body : JSON.stringify(a.body, null, 2);
}
function headersText(a) {
  return (a.headers || []).map(h => h.key + ": " + h.value).join("\n");
}
function paramsText(a) {
  const ps = a.params || [];
  if (!ps.length) return "";
  // 输出 query string 格式，可直接拼到 URL 或填入调试工具
  return ps.map(p => encodeURIComponent(p.key) + "=" + encodeURIComponent(p.value)).join("&");
}

function renderDetail(a) {
  const headers = a.headers || [], params = a.params || [];
  const bText = bodyText(a);
  const bodyHtml = a.body
    ? `<div class="section"><h2><span class="h2-left">请求体 ${a.bodyType ? `<span class="tag-chip">${esc(a.bodyType)}</span>` : ""}</span><button class="btn" id="copy-body">复制</button></h2>
      <div class="body"><pre class="code">${esc(bText)}</pre></div></div>` : "";
  const respHtml = a.response
    ? `<div class="section"><h2><span class="h2-left">响应示例</span><button class="btn" id="copy-resp">复制</button></h2><div class="body"><pre class="code">${esc(typeof a.response === "string" ? a.response : JSON.stringify(a.response, null, 2))}</pre></div></div>` : "";
  const paramsHtml = params.length
    ? `<div class="section"><h2><span class="h2-left">Query 参数</span><button class="btn" id="copy-params">复制</button></h2><div class="body"><table>
        <tr><th style="width:220px">参数名</th><th>示例值</th><th style="width:70px">必填</th><th>说明</th></tr>
        ${tableRows(params, [
          {cls:"k", key:"key"},
          {cls:"v", key:"value"},
          {cls:"d", render: r => r.required ? '<span class="required-dot">●</span>是' : "否"},
          {cls:"d", key:"description"}
        ])}</table></div></div>` : "";
  const headersHtml = headers.length
    ? `<div class="section"><h2><span class="h2-left">请求头</span><button class="btn" id="copy-headers">复制</button></h2><div class="body"><table>
        <tr><th style="width:240px">Header</th><th>值</th><th>说明</th></tr>
        ${tableRows(headers, [{cls:"k", key:"key"}, {cls:"v", key:"value"}, {cls:"d", key:"description"}])}</table></div></div>` : "";

  $("#main").innerHTML = `
    <div class="detail-head">
      <span class="tag-chip">${esc(a.tag || "未分组")}</span>
      <h1>${esc(a.name || a.path)}</h1>
      ${a.description ? `<div class="desc">${esc(a.description)}</div>` : ""}
      <div class="url-bar">
        <span class="method-badge ${mClass(a.method)}">${esc(a.method)}</span>
        <span class="url">${esc(a.url)}</span>
        <button class="btn" id="copy-url">复制 URL</button>
        <button class="btn" id="btn-debug">调试</button>
      </div>
    </div>
    <div id="debug-panel" class="debug-panel" style="display:none">
      <div class="dbg-row">
        <select id="dbg-method" class="dbg-select">${METHODS.map(m => `<option value="${m}">${m}</option>`).join("")}</select>
        <input id="dbg-url" class="dbg-input" placeholder="https://...">
      </div>
      <div class="micro-label" style="margin-bottom:6px">请求头（每行 Key: Value）</div>
      <textarea id="dbg-headers" class="dbg-textarea" rows="4" placeholder="Content-Type: application/json"></textarea>
      <div class="micro-label" style="margin-bottom:6px">请求体</div>
      <textarea id="dbg-body" class="dbg-textarea" rows="5" placeholder="{}"></textarea>
      <div class="dbg-actions">
        <button class="btn btn-primary" id="dbg-send">发送请求</button>
        <button class="btn" id="dbg-reset">重置</button>
        <button class="btn" id="dbg-open">新标签打开</button>
        <span class="dbg-hint" id="dbg-hint"></span>
      </div>
      <div id="dbg-result" class="dbg-result" style="display:none">
        <div class="dbg-meta">
          <span class="status-chip" id="dbg-status"></span>
          <span class="muted" id="dbg-time"></span>
          <span class="muted" id="dbg-size"></span>
        </div>
        <details><summary>响应头</summary><pre class="code" id="dbg-resp-headers"></pre></details>
        <div class="micro-label" style="margin-bottom:6px">响应体</div>
        <pre class="code" id="dbg-resp-body"></pre>
      </div>
    </div>
    ${paramsHtml}${headersHtml}${bodyHtml}${respHtml}
    <div class="section"><h2><span class="h2-left">cURL 命令</span><button class="btn btn-primary" id="copy-curl">复制 cURL</button></h2>
      <div class="body"><pre class="code">${esc(a.curl)}</pre></div></div>`;

  $("#copy-url").onclick = e => copyText(a.url, e.target);
  const cp = $("#copy-params"); if (cp) cp.onclick = e => copyText(paramsText(a), e.target);
  const ch = $("#copy-headers"); if (ch) ch.onclick = e => copyText(headersText(a), e.target);
  const cb = $("#copy-body");   if (cb) cb.onclick = e => copyText(bodyText(a), e.target);
  const cr = $("#copy-resp");   if (cr) cr.onclick = e => copyText(typeof a.response === "string" ? a.response : JSON.stringify(a.response, null, 2), e.target);
  $("#copy-curl").onclick = e => copyText(a.curl, e.target, "已复制 ✓");
  $("#main").scrollTop = 0;

  /* ---------- debug panel ---------- */
  const dp = $("#debug-panel"), dm = $("#dbg-method"), du = $("#dbg-url");
  const dh = $("#dbg-headers"), db = $("#dbg-body");
  const ds = $("#dbg-send"), dr = $("#dbg-reset"), dn = $("#dbg-open"), dl = $("#dbg-hint");
  const drs = $("#dbg-result"), dst = $("#dbg-status"), dtm = $("#dbg-time");
  const dsz = $("#dbg-size"), drh = $("#dbg-resp-headers"), drb = $("#dbg-resp-body");
  let dbgOpen = false;

  function prefill() {
    dm.value = a.method; du.value = a.url; dh.value = headersText(a);
    db.value = bodyText(a); drs.style.display = "none"; dl.textContent = "";
    dn.style.display = a.method === "GET" || a.method === "HEAD" ? "" : "none";
  }
  prefill();

  $("#btn-debug").onclick = () => {
    dbgOpen = !dbgOpen;
    dp.style.display = dbgOpen ? "block" : "none";
    $("#btn-debug").textContent = dbgOpen ? "收起调试" : "调试";
    if (dbgOpen) prefill();
  };

  dr.onclick = () => { prefill(); dl.textContent = ""; };

  dn.onclick = () => { window.open(du.value || a.url, "_blank"); };

  ds.onclick = async () => {
    const method = dm.value, url = du.value.trim();
    if (!url) { dl.textContent = "请填写 URL"; return; }
    const headersRaw = dh.value.trim();
    const bodyRaw = db.value.trim();
    // parse headers
    const hdrs = {};
    if (headersRaw) {
      headersRaw.split("\n").forEach(line => {
        const i = line.indexOf(":");
        if (i > 0) { const k = line.slice(0,i).trim(), v = line.slice(i+1).trim(); if (k) hdrs[k] = v; }
      });
    }
    // show loading
    drs.style.display = "none"; dl.textContent = "";
    ds.disabled = true;
    ds.innerHTML = '<span class="dbg-spinner"></span> 请求中...';
    const start = performance.now();
    try {
      const opts = { method, headers: hdrs };
      const noBody = method === "GET" || method === "HEAD";
      if (!noBody && bodyRaw) {
        // auto-detect if json
        const ct = Object.keys(hdrs).find(k => k.toLowerCase()==="content-type")||"";
        if (ct.includes("json")) {
          try { JSON.parse(bodyRaw); opts.body = bodyRaw; } catch(e) { opts.body = bodyRaw; }
        } else { opts.body = bodyRaw; }
      }
      const res = await fetch(url, opts);
      const text = await res.text();
      const elapsed = Math.round(performance.now() - start);
      drs.style.display = "block";
      // status chip
      const sc = Math.floor(res.status/100);
      dst.className = "status-chip " + (sc>=2&&sc<=5?"status-"+sc:"status-err");
      dst.textContent = res.status + " " + res.statusText;
      dtm.textContent = elapsed + " ms";
      dsz.textContent = (new Blob([text]).size) + " bytes";
      drh.textContent = [...res.headers.entries()].map(([k,v]) => k+": "+v).join("\n");
      // try pretty json
      try { drb.textContent = JSON.stringify(JSON.parse(text), null, 2); }
      catch(e) { drb.textContent = text; }
      drb.style.color = sc === 2 ? "var(--success)" : sc === 4 ? "var(--warning)" : "var(--text)";
    } catch(err) {
      drs.style.display = "block";
      dst.className = "status-chip status-err"; dst.textContent = "失败";
      dtm.textContent = ""; dsz.textContent = "";
      drh.textContent = ""; drb.textContent = err.message || String(err);
      drb.style.color = "var(--danger)";
      dl.innerHTML = '请求被浏览器拦截，通常因跨域(CORS)限制或网络不可达。建议：<a style="color:var(--accent);cursor:pointer" onclick="this.closest(\'.detail-head\')?.querySelector(\'#copy-curl\')?.click()">复制 cURL</a> 在终端执行，或使用「新标签打开」(仅GET)。';
    }
    ds.disabled = false; ds.textContent = "发送请求";
  };
}

function renderOverview() {
  const groups = groupApis(APIS);
  const mc = {};
  APIS.forEach(a => mc[a.method] = (mc[a.method] || 0) + 1);
  $("#main").innerHTML = `
    <div class="overview-title"><span class="grad">${esc(DOC.title)}</span></div>
    <div class="overview-sub">共收录 <b>${APIS.length}</b> 个接口，分为 <b>${groups.size}</b> 个模块。${DOC.source ? `数据来源：${esc(DOC.source)}。` : ""}${DOC.generatedAt ? `生成时间：${esc(DOC.generatedAt)}。` : ""}<br>点击左侧接口查看详情，或在顶部搜索框按名称 / 路径 / 描述检索。</div>
    <div class="stat-cards">
      ${[...groups.entries()].map(([t, items]) =>
        `<div class="stat-card"><div class="num">${items.length}</div><div class="label">${esc(t)}</div></div>`).join("")}
    </div>
    <div class="section"><h2><span class="h2-left">请求方法分布</span></h2><div class="body">
      ${Object.entries(mc).map(([m, n]) =>
        `<span class="method-badge ${mClass(m)}" style="margin:0 8px 8px 0;min-width:64px;display:inline-block">${esc(m)} · ${n}</span>`).join("")}
    </div></div>`;
}

function selectApi(id, push) {
  const a = APIS.find(x => x.id === id);
  if (!a) return;
  activeId = id;
  document.querySelectorAll(".api-item").forEach(el =>
    el.classList.toggle("active", +el.dataset.id === id));
  renderDetail(a);
  if (push) history.replaceState(null, "", "#api-" + id);
}

/* ---------- search ---------- */
let debounce;
$("#search").addEventListener("input", e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { keyword = e.target.value; renderSidebar(); }, 120);
});
$("#search-clear").onclick = () => { $("#search").value = ""; keyword = ""; renderSidebar(); $("#search").focus(); };
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#search")) { e.preventDefault(); $("#search").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#search")) { $("#search").value = ""; keyword = ""; renderSidebar(); }
});

/* ---------- init ---------- */
$("#doc-title").textContent = DOC.title || "API 接口文档";
document.title = DOC.title || "API 接口文档";
renderSidebar();
const hash = location.hash.match(/^#api-(\d+)$/);
if (hash && APIS.some(a => a.id === +hash[1])) selectApi(+hash[1], false);
else renderOverview();
