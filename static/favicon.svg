<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" role="img" aria-label="API Console">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#c7d2fe"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
      <animate attributeName="x1" values="-1;1;-1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0"/>
      <stop offset="50%" style="stop-color:#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" style="stop-color:#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="roundClip"><rect x="4" y="4" width="92" height="92" rx="22"/></clipPath>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bgGrad)"/>
  <g clip-path="url(#roundClip)">
    <rect x="-40" y="4" width="40" height="92" fill="url(#shine)">
      <animate attributeName="x" values="-40;120" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="2" fill="url(#textGrad)" filter="url(#softShadow)">API</text>
  <rect x="38" y="68" width="24" height="2.5" rx="1.25" fill="#ffffff" opacity="0.5">
    <animate attributeName="opacity" values="0.25;0.8;0.25" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="width" values="20;28;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x" values="40;36;40" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
