[pytest]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings = ignore:Unverified HTTPS request:urllib3.exceptions.InsecureRequestWarning
addopts = --alluredir=allure-results --clean-alluredir
;base_url = https://api.uomg.com/api/qq.info
;base_url = https://apiv1-es.businessconnectchina.cn:7443
